<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>키보드 테스트</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>⌨️ 키보드 테스트</h1>
        <p>모든 키를 한 번씩 눌러 정상 동작을 확인하세요. 누른 키는 초록색으로 바뀝니다.</p>
      </div>
      <div class="stats">
        <div class="progress">
          <div class="progress-meta">
            <span>진행률</span>
            <span><b id="count">0</b> / <span id="total">0</span></span>
          </div>
          <div class="bar"><span id="fill"></span></div>
        </div>
        <button class="reset" id="reset">초기화</button>
      </div>
    </header>

    <div class="banner error" id="error" hidden></div>
    <div class="banner success" id="success" hidden>
      🎉 모든 키가 정상 입력되었습니다! 키보드에 이상이 없습니다.
    </div>

    <main class="board" id="board"></main>

    <section class="unmapped">
      <h2>미매핑 키 (레이아웃에 없는 keycode)</h2>
      <div class="chips" id="chips"></div>
    </section>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
